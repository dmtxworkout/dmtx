name = "dmtx-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Non-secret vars. Secrets (DATABASE_URL, BETTER_AUTH_SECRET, RESEND_API_KEY,
# CF_ACCOUNT_ID, CF_API_TOKEN, CF_IMAGES_ACCOUNT_HASH, CF_STREAM_*) go in
# .dev.vars locally and `wrangler secret put` in production.
[vars]
BETTER_AUTH_URL = "http://localhost:8787"
ADMIN_ORIGIN = "http://localhost:3001"
EMAIL_FROM = "DMTX <no-reply@dmtx.app>"

# Daily billing run (implemented in the billing phase; needs a scheduled()
# handler before enabling).
# [triggers]
# crons = ["0 13 * * *"]
