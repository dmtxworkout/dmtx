name = "dmtx-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# The domain must be on this Cloudflare account for a deploy to take this.
[[routes]]
pattern = "api.dmtxworkout.com"
custom_domain = true

# Non-secret vars. Secrets (DATABASE_URL, BETTER_AUTH_SECRET, RESEND_API_KEY,
# CF_ACCOUNT_ID, CF_API_TOKEN, CF_IMAGES_ACCOUNT_HASH, CF_STREAM_*) go in
# .dev.vars locally and `wrangler secret put` in production.
[vars]
# Production values; .dev.vars replaces these two with localhost in `pnpm dev`.
BETTER_AUTH_URL = "https://api.dmtxworkout.com"
ADMIN_ORIGIN = "https://admin.dmtxworkout.com"
EMAIL_FROM = "DMTX <no-reply@dmtxworkout.com>"

# Daily, at 00:10 in Ecuador (UTC-5): the reports' summary (scheduled() in src/index.ts).
# The billing run will need its own entry here.
[triggers]
crons = ["10 5 * * *"]
