packages:
  - "apps/*"
  - "packages/*"

# Pin a single copy across the whole monorepo (two Zod copies => ZodType errors;
# @hono/zod-openapi requires Zod 4).
overrides:
  zod: 4.4.3
  typescript: 5.9.3

minimumReleaseAgeExclude:
  - '@next/eslint-plugin-next@16.2.12'
  - '@turbo/darwin-64@2.10.7'
  - '@turbo/darwin-arm64@2.10.7'
  - '@turbo/linux-64@2.10.7'
  - '@turbo/linux-arm64@2.10.7'
  - '@turbo/windows-64@2.10.7'
  - '@turbo/windows-arm64@2.10.7'
  - turbo@2.10.7
  - '@cloudflare/workers-types@5.20260726.1'
  - '@hookform/resolvers@5.5.7'
  - '@next/env@16.2.12'
  - '@next/swc-darwin-arm64@16.2.12'
  - '@next/swc-darwin-x64@16.2.12'
  - '@next/swc-linux-arm64-gnu@16.2.12'
  - '@next/swc-linux-arm64-musl@16.2.12'
  - '@next/swc-linux-x64-gnu@16.2.12'
  - '@next/swc-linux-x64-musl@16.2.12'
  - '@next/swc-win32-arm64-msvc@16.2.12'
  - '@next/swc-win32-x64-msvc@16.2.12'
  - next@16.2.12

# Allow these dependencies to run their install/build scripts (pnpm >= 10 blocks by default).
onlyBuiltDependencies:
  - esbuild
  - workerd
  - "@tailwindcss/oxide"
  - sharp
  - "@parcel/watcher"
  - unrs-resolver

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
